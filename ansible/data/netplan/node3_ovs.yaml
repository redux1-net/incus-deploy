# node3

network:
  version: 2
  renderer: networkd
  openvswitch:
    other-config:
      hw-offload: true

  ethernets:
    # loopback IPs for chrony
    lo:
      addresses:
        - 10.1.3.123/32
        - fdd0:db2:ffff::3:123/128

    mlx0:
      match:
        macaddress: b8:ce:f6:27:bd:30
      set-name: mlx0
      optional: true
      accept-ra: false
      dhcp4: false
      dhcp6: false
      mtu: 9000
    mlx1:
      match:
        macaddress: b8:ce:f6:27:bd:31
      set-name: mlx1
      optional: true
      accept-ra: false
      dhcp4: false
      dhcp6: false
      mtu: 9000
    vif0:
      match:
        macaddress: bc:24:11:16:dc:60
      set-name: vif0
      optional: true
      accept-ra: false
      dhcp4: false
      dhcp6: false
      mtu: 9000
      # offload issues due to virtualization
      receive-checksum-offload: true
      transmit-checksum-offload: false
    vif1:
      match:
        macaddress: bc:24:11:fb:53:e0
      set-name: vif1
      optional: true
      accept-ra: false
      dhcp4: false
      dhcp6: false
      mtu: 9000
      # offload issues due to virtualization
      receive-checksum-offload: true
      transmit-checksum-offload: false

  # OVSBonds
  bonds:
    bond0:
      interfaces:
        - mlx0
        - mlx1
        - vif0
        - vif1
      accept-ra: false
      dhcp4: false
      dhcp6: false
      mtu: 9000
      parameters:
        mode: balance-tcp
      openvswitch:
        lacp: active
        other-config:
          lacp-time: fast
          bond-detect-mode: miimon
          bond-miimon-interval: 100

  # OVSBridges
  bridges:
    ovsbr0:
      interfaces:
        - bond0
      link-local: []
      accept-ra: false
      dhcp4: false
      dhcp6: false
      openvswitch: {}

  # OVSIntPorts
  vlans:
    nodemgmt:
      link: ovsbr0
      id: 200
      accept-ra: true
      dhcp4: false
      dhcp6: false
      mtu: 1500
      optional: false
      addresses:
        - 192.168.200.13/24
        - fd41:f666:2a1a:200::13/64
      routes:
        - to: default
          via: 192.168.200.1
      nameservers:
        search:
          - int.redux1.net
        addresses:
          - 10.1.1.53

    clustering:
      link: ovsbr0
      id: 201
      accept-ra: false
      dhcp4: false
      dhcp6: false
      mtu: 9000
      addresses:
        - 192.168.201.13/24
        - fd41:f666:2a1a:201::13/64
